<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Grooming Lab | Classic Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@500&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #e5e5e5; scroll-behavior: smooth; overflow-x: hidden; }
        .heading-font { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 4px; }
        
        #loader { position: fixed; inset: 0; z-index: 9999; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 1s ease; }

        /* NAVBAR SMART SWAP */
        .nav-container { position: relative; width: 70px; height: 20px; display: flex; justify-content: center; align-items: center; }
        #nav-services, #nav-studio { position: absolute; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); white-space: nowrap; left: 0; }
        .link-active { opacity: 0.6; transform: translateY(0); pointer-events: auto; }
        .link-active:hover { opacity: 1; }
        .link-hidden { opacity: 0; transform: translateY(10px); pointer-events: none; }

        /* Service Cards & Hidden Book Button */
        .service-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; position: relative; }
        .service-card:hover { transform: translateY(-15px); border-color: #d4af37; background: rgba(255, 255, 255, 0.08); }
        
        .card-book-btn { 
            opacity: 0; transform: translateY(10px); transition: all 0.4s ease;
            background: #fff; color: #000; font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 2px;
        }
        .service-card:hover .card-book-btn { opacity: 1; transform: translateY(0); }

        /* MAP SECTION */
        #map-section { height: 500px; position: relative; background-color: #000; opacity: 0; transform: translateY(60px); filter: blur(5px); transition: all 1.2s ease-out; }
        #map-section.map-visible { opacity: 1; transform: translateY(0); filter: blur(0px); }
        #dark-map { height: 100%; width: 100%; filter: grayscale(100%) invert(100%) brightness(0.7) contrast(1.2); }
        .red-map-label { background: transparent !important; border: none !important; color: #ff0000 !important; font-family: 'Oswald', sans-serif; font-weight: bold; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px rgba(255,0,0,0.5); }
        .map-info-box { position: absolute; top: 50%; left: 2.5rem; transform: translateY(-50%); z-index: 10; padding: 2rem; background: rgba(0, 0, 0, 0.95); border-left: 3px solid #ff0000; backdrop-filter: blur(8px); max-width: 320px; }

        @media (max-width: 768px) {
            .map-info-box { position: static; transform: none; max-width: 100%; border-left: none; border-top: 1px solid #ff0000; text-align: center; padding: 2rem 1.5rem; background: #000; }
            #map-section { height: 350px; }
            #chat-window { width: 85vw !important; height: 380px !important; right: 0 !important; bottom: 80px !important; }
        }

        /* CONCIERGE */
        #chat-window { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); transform: translateY(30px); opacity: 0; pointer-events: none; background: rgba(10, 10, 10, 0.98); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); position: absolute; bottom: 70px; right: 0; width: 320px; height: 450px; }
        #chat-window.active { transform: translateY(0); opacity: 1; pointer-events: auto; }
        .concierge-trigger { background: #000; border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; font-family: 'Oswald', sans-serif; letter-spacing: 3px; }
    </style>
</head>
<body>

    <div id="loader">
        <button onclick="enterStudio()" class="heading-font text-white border border-zinc-800 px-10 py-4 tracking-[0.5em] hover:border-white transition-all duration-500">ENTER STUDIO</button>
    </div>

    <audio id="click-sound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>
    <audio id="hover-sound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>

    <nav id="main-nav" class="fixed w-full z-50 px-6 md:px-10 py-8 flex justify-between items-center transition-all duration-500">
        <h1 class="heading-font text-lg md:text-xl font-bold text-white tracking-[0.4em] cursor-pointer" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">GROOMING LAB</h1>
        <div class="flex space-x-6 items-center">
            <div class="nav-container">
                <a href="#services" id="nav-services" class="text-[10px] tracking-[0.2em] uppercase link-active text-white">Services</a>
                <a href="#map-section" id="nav-studio" class="text-[10px] tracking-[0.2em] uppercase link-hidden text-white">Studio</a>
            </div>
        </div>
    </nav>

    <section id="home" class="relative h-[95vh] flex flex-col justify-center items-center text-center px-4 overflow-hidden">
        <video id="hero-video" muted loop playsinline class="absolute z-0 w-auto min-w-full min-h-full max-w-none grayscale brightness-[0.4]">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-barber-cutting-hair-with-a-pair-of-scissors-19409-large.mp4" type="video/mp4">
        </video>
        <div class="absolute inset-0 z-1 video-overlay"></div>
        <div class="relative z-10 text-white">
            <h2 data-aos="zoom-out" data-aos-duration="2000" class="heading-font text-5xl md:text-[10rem] mb-6 leading-none">THE STANDARD</h2>
            <p data-aos="fade-up" data-aos-delay="800" class="text-[10px] md:text-xs tracking-[0.6em] text-zinc-400 uppercase">Legacy in every cut</p>
        </div>
    </section>

    <section id="services" class="py-20 md:py-32 px-6 md:px-8 max-w-7xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="service-card p-5 rounded-2xl" onmouseenter="playHover()" onclick="bookFromCard('Signature Haircut')" data-aos="fade-up">
                <div class="overflow-hidden rounded-xl mb-6 h-64 md:h-72"><img src="https://images.unsplash.com/photo-1585747860715-2ba37e788b70?q=80&w=800" class="w-full h-full object-cover grayscale transition duration-700"></div>
                <h3 class="heading-font text-white">Haircut</h3>
                <div class="flex justify-between items-center border-t border-zinc-800 mt-4 pt-4">
                    <span class="text-sm font-bold">$45</span>
                    <button class="card-book-btn px-4 py-2 uppercase">Book Now</button>
                </div>
            </div>
            
            <div class="service-card p-5 rounded-2xl" id="trigger-card" onmouseenter="playHover()" onclick="bookFromCard('Classic Shave')" data-aos="fade-up" data-aos-delay="100">
                <div class="overflow-hidden rounded-xl mb-6 h-64 md:h-72"><img src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?q=80&w=800" class="w-full h-full object-cover grayscale transition duration-700"></div>
                <h3 class="heading-font text-white">Shave</h3>
                <div class="flex justify-between items-center border-t border-zinc-800 mt-4 pt-4">
                    <span class="text-sm font-bold">$35</span>
                    <button class="card-book-btn px-4 py-2 uppercase">Book Now</button>
                </div>
            </div>

            <div class="service-card p-5 rounded-2xl" onmouseenter="playHover()" onclick="bookFromCard('Beard Sculpt')" data-aos="fade-up" data-aos-delay="200">
                <div class="overflow-hidden rounded-xl mb-6 h-64 md:h-72"><img src="https://images.unsplash.com/photo-1621605815971-fbc98d665033?q=80&w=800" class="w-full h-full object-cover grayscale transition duration-700"></div>
                <h3 class="heading-font text-white">Beard</h3>
                <div class="flex justify-between items-center border-t border-zinc-800 mt-4 pt-4">
                    <span class="text-sm font-bold">$25</span>
                    <button class="card-book-btn px-4 py-2 uppercase">Book Now</button>
                </div>
            </div>

            <div class="service-card p-5 rounded-2xl" onmouseenter="playHover()" onclick="bookFromCard('Skin Therapy')" data-aos="fade-up" data-aos-delay="300">
                <div class="overflow-hidden rounded-xl mb-6 h-64 md:h-72"><img src="https://images.unsplash.com/photo-1512290923902-8a9f81dc236c?q=80&w=800" class="w-full h-full object-cover grayscale transition duration-700"></div>
                <h3 class="heading-font text-white">Detan</h3>
                <div class="flex justify-between items-center border-t border-zinc-800 mt-4 pt-4">
                    <span class="text-sm font-bold">$50</span>
                    <button class="card-book-btn px-4 py-2 uppercase">Book Now</button>
                </div>
            </div>
        </div>
    </section>

    <section id="map-section">
        <div id="dark-map"></div>
        <div class="map-info-box">
            <h4 class="heading-font text-[#ff0000] text-lg mb-2">Our Landmark</h4>
            <p class="text-[#cc0000] text-[10px] leading-relaxed uppercase tracking-widest mb-2 md:mb-4">Old Town District, Near Clock Tower</p>
            <p class="text-white text-[11px] font-mono">12.9684° N, 80.2079° E</p>
        </div>
    </section>

    <div class="fixed bottom-6 right-6 md:bottom-10 md:right-10 z-[100]">
        <div id="chat-window" class="flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-zinc-900 flex justify-between items-center text-white">
                <span class="heading-font text-[9px] tracking-[0.2em]">Digital Concierge</span>
                <button onclick="toggleChat()" class="text-zinc-600 transition text-xl">&times;</button>
            </div>
            <div id="chat-content" class="flex-1 p-5 overflow-y-auto text-[11px] space-y-4 text-zinc-400">
                <div class="border-l border-zinc-800 pl-4 py-1">Greetings. <br><br> 1. Haircut | 2. Shave | 3. Beard | 4. Reservation</div>
            </div>
            <div class="p-4 bg-black/50 border-t border-zinc-900 flex flex-col gap-2">
                <input id="chat-input" type="text" placeholder="SELECTION..." class="bg-transparent text-[10px] outline-none text-white border-b border-zinc-800 pb-2 uppercase" onkeypress="if(event.key === 'Enter') { playClick(); handleChat(); }">
                <button onclick="playClick(); handleChat();" class="heading-font text-[9px] text-zinc-500 uppercase text-left">Send Entry</button>
            </div>
        </div>
        <button id="concierge-btn" onclick="playClick(); toggleChat();" class="concierge-trigger px-6 py-3 text-[9px] uppercase">Concierge</button>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const clickSound = document.getElementById('click-sound');
        const hoverSound = document.getElementById('hover-sound');
        const heroVideo = document.getElementById('hero-video');

        function enterStudio() {
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 1000);
            clickSound.play().then(() => { clickSound.pause(); clickSound.currentTime = 0; });
            hoverSound.play().then(() => { hoverSound.pause(); hoverSound.currentTime = 0; });
            heroVideo.play();
            AOS.init({ duration: 1000, once: false, mirror: true });
        }

        function playClick() { clickSound.currentTime = 0; clickSound.volume = 0.4; clickSound.play(); }
        function playHover() { hoverSound.currentTime = 0; hoverSound.volume = 0.2; hoverSound.play(); }

        const coords = [12.9684, 80.2079];
        let botTriggered = false;

        window.addEventListener('scroll', () => {
            const scrollPos = window.scrollY;
            const servicesSection = document.getElementById('services');
            const mapSection = document.getElementById('map-section');
            const navServices = document.getElementById('nav-services');
            const navStudio = document.getElementById('nav-studio');

            if (scrollPos >= mapSection.offsetTop - 400) {
                navServices.classList.replace('link-active', 'link-hidden');
                navStudio.classList.replace('link-hidden', 'link-active');
            } else if (scrollPos >= servicesSection.offsetTop - 300) {
                navServices.classList.replace('link-active', 'link-hidden');
                navStudio.classList.replace('link-hidden', 'link-active');
            } else {
                navServices.classList.replace('link-hidden', 'link-active');
                navStudio.classList.replace('link-active', 'link-hidden');
            }

            const mapRect = mapSection.getBoundingClientRect();
            if (mapRect.top < window.innerHeight - 150) { mapSection.classList.add('map-visible'); } 
            else { mapSection.classList.remove('map-visible'); }

            if (window.innerWidth > 768 && scrollPos >= document.getElementById('trigger-card').offsetTop && !botTriggered) {
                playClick(); toggleChat(); botTriggered = true;
            }
        });

        // Map Init
        const map = L.map('dark-map', { zoomControl: false, attributionControl: false }).setView(coords, 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.marker(coords, { icon: L.divIcon({ className: 'red-map-label', html: 'Grooming Lab', iconSize: [120, 20], iconAnchor: [60, 25] }) }).addTo(map);
        L.circleMarker(coords, { radius: 6, color: 'red', fillColor: 'red', fillOpacity: 0.8 }).addTo(map);

        function toggleChat() { document.getElementById('chat-window').classList.toggle('active'); document.getElementById('chat-input').focus(); }
        
        function bookFromCard(serviceName) {
            playClick();
            if(!document.getElementById('chat-window').classList.contains('active')) toggleChat();
            const input = document.getElementById('chat-input');
            input.value = serviceName;
            handleChat();
        }

        function handleChat() {
            const input = document.getElementById('chat-input');
            const content = document.getElementById('chat-content');
            if(!input.value.trim()) return;
            content.innerHTML += `<div class="text-right text-white uppercase text-[9px]">> ${input.value}</div>`;
            const val = input.value;
            input.value = '';
            content.scrollTop = content.scrollHeight;
            setTimeout(() => {
                content.innerHTML += `<div class="border-l border-yellow-800/50 pl-4 py-1 text-zinc-300 uppercase tracking-tighter">Acknowledged. Requesting digits for ${val} confirmation.</div>`;
                content.scrollTop = content.scrollHeight;
            }, 800);
        }
    </script>
</body>
</html>
